name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing left to prove.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build comes first on purpose: @perchjs/* resolves through its exports
      # map into dist, so boundaries and tests both need it to exist.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # ARCH 12 §1 — the domain stays pure and no adapter reaches another.
      # Blocking from the first commit, before the code it protects exists.
      - name: Architecture boundaries
        run: pnpm boundaries

      - name: Test
        run: pnpm test

      # What a consumer receives: publint validates the manifest, attw resolves
      # the package the four ways TypeScript can.
      - name: Published package contract
        run: pnpm package:check

      - name: Formatting
        run: pnpm format:check

# Guardrails still to come, each with the lot that makes it measurable
# (CLAUDE.md, "Garde-fous CI"):
#
#   SQL query counter per page (anti N+1)     → needs a database in CI
#   p95 on /records                           → needs a database in CI
#   concurrency: 100 parallel requests        → PRD 02, once builders exist
#   attack test: an unauthorised action       → PRD 04, with `can`
#
# The DMMF contract test is no longer on this list: it runs inside `pnpm test`,
# against the DMMF a real `prisma generate` hands the generator (ADR 0012). It
# needs no database, which is why it can. The two above still do — proving that
# Prisma *accepts* the adapter's arguments is the same lot of work as counting
# the queries they cost.
#
# They are listed here rather than in a backlog so that adding one is a visible
# edit to this file, and so that their absence is legible today.
