name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing left to prove.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The adapter's unit tests assert translation against a recorder; they would
    # pass on arguments Prisma rejects. tooling/database.test.ts is what says
    # otherwise, and it needs a real one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: perch
          POSTGRES_PASSWORD: perch
          POSTGRES_DB: perch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://perch:perch@localhost:5432/perch

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build comes first on purpose: @perchjs/* resolves through its exports
      # map into dist, so boundaries and tests both need it to exist.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The domain stays pure and no adapter reaches another.
      # Blocking from the first commit, before the code it protects exists.
      - name: Architecture boundaries
        run: pnpm boundaries

      # After the build: the Perch generator runs from dist, and `db push` needs
      # no destructive flag because the service starts empty.
      - name: Prepare the integration database
        working-directory: tooling
        run: |
          ./node_modules/.bin/prisma generate
          ./node_modules/.bin/prisma db push

      - name: Test
        run: pnpm test

      # What a consumer receives: publint validates the manifest, attw resolves
      # the package the four ways TypeScript can.
      - name: Published package contract
        run: pnpm package:check

      - name: Formatting
        run: pnpm format:check

  # ---------------------------------------------------------------- release
  #
  # Opens a version pull request while changesets are pending, and publishes
  # once that pull request is merged — which is the moment the changeset files
  # are gone and the versions in the tree have moved.
  #
  # `release:version` runs `scripts/changelog.mjs` before `changeset version`,
  # because the second consumes the files the first reads.
  #
  # `release:publish` builds and publishes, and does not verify again. It was
  # written the other way, on the argument that `changeset version` rewrites
  # every manifest — true, and beside the point: those rewrites land in a pull
  # request, and merging it starts a run whose own `verify` covers exactly the
  # tree about to be sent. Re-running it here cost seven minutes and then
  # failed, because the suite wants a PostgreSQL this job never starts and the
  # database test refuses to skip itself in CI. The build stays: publishing
  # without it would send six tarballs with no `dist` in them.
  release:
    name: release
    needs: verify
    if: github.repository == 'nangui/perch' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Its own group, and never cancelled. The workflow above cancels a
    # superseded run because a superseded check has nothing left to prove; a
    # superseded publish has already sent packages to a registry that does not
    # take them back, and stopping halfway is what leaves the five at different
    # versions.
    concurrency:
      group: release
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      # npm provenance: the registry records which workflow built the tarball.
      id-token: write

    steps:
      # Full history: `select-mode` reads what is on the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Off, and said rather than omitted: the input defaults to true and
          # detects `packageManager` in the root manifest, so leaving it out
          # caches. A release must be built from the lockfile and nothing else
          # — a cache is the one way the tarball that goes to the registry is
          # not the tree that was verified.
          package-manager-cache: false
          # Writes the .npmrc the OIDC exchange below reads.
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # A token, for the first release only, and it is not the preference.
      #
      # The registry would rather have neither: trusted publishing hands this
      # workflow a short-lived credential over OIDC and leaves nothing in the
      # settings to rotate or to leak. It cannot be used yet, and that was
      # measured rather than assumed — `npm trust github @perchjs/core` answers
      # 403 while the registry has never heard of the package. The scope exists
      # and the account owns it; the package does not, and a trusted publisher
      # is declared against a package.
      #
      # So: publish 0.1.0 with the token below, then run, once per package,
      #   npm trust github @perchjs/core --file ci.yml --repo nangui/perch
      # and the same for prisma, prisma-generator, nest, ui and cli — they exist
      # by then. It asks for a second factor and it says plainly what it grants:
      # anyone with write access to this repository can publish that package.
      # Then delete NODE_AUTH_TOKEN below and the NPM_TOKEN secret with it.
      #
      # Provenance is on because the repository is public: the registry does not
      # generate an attestation for a private one, and this was off for exactly
      # as long as that was true.
      #
      # Still unverified, and only the first release will say: whether the OIDC
      # exchange survives `changeset publish`, which runs `npm publish` once per
      # package rather than once.
      # Which of the two this run is: `version` while changesets are pending,
      # `publish` once they are gone and the manifests have moved.
      - uses: changesets/action/select-mode@v2
        id: select

      - uses: changesets/action/version@v2
        if: steps.select.outputs.mode == 'version'
        with:
          script: pnpm release:version
          pr-title: "chore: release"
          commit-message: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: changesets/action/publish@v2
        if: steps.select.outputs.mode == 'publish'
        with:
          script: pnpm release:publish
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

# The guardrails this project set itself before the code they protect existed.
# All six now run, five of them inside `pnpm test` and one in its own step:
#
#   the domain stays pure           → `pnpm boundaries` above, depcruise
#   the DMMF contract               → against what a real `prisma generate` gives
#   the SQL query counter           → tooling/database.test.ts, real statements
#   p95 on /state and on /records   → 100 HTTP round trips each
#   an unauthorised action          → milestone-a2, on a forged request
#   100 requests at once            → concurrency.http.test.ts
#
# The last one is worth a line, because it was nearly written useless. Node runs
# each request's synchronous stretch to completion, so a hundred requests whose
# resolvers never await never interleave: with synchronous resolvers, a build
# that deliberately held the principal in a shared variable passed every case.
# The resolvers there yield, which is what a real one does when it reaches a
# database, and that is what puts the requests inside one another.
#
# The list stays rather than being deleted: adding a seventh is a visible edit
# to this file, and what is measured is legible without reading the suite.
